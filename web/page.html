<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Ink Frame</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #f6f5f2; --card: #fff; --muted: #6b6b6b; --line: #ddd; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #161616; --card: #222; --muted: #9a9a9a; --line: #333; --bad: #f2b8b5; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  form.upload { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  form.upload input[type=file] { flex: 1 1 200px; min-width: 0; }
  button { font: inherit; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--fg); color: var(--bg); cursor: pointer; }
  button.delete { background: none; color: var(--bad); border-color: currentColor; padding: 6px 12px; }
  .problems { margin: 16px 0 0; padding: 12px 16px; border: 1px solid var(--bad); border-radius: 8px; color: var(--bad); }
  .problems ul { margin: 0; padding-left: 20px; }
  .gallery { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
  .gallery li { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .gallery li[aria-current] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--fg); }
  .badge { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 0.8rem; }
  .actions { display: flex; gap: 6px; flex: none; }
  button.show { padding: 6px 12px; }
  .gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--line); }
  .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 0.9rem; }
  .empty { color: var(--muted); margin-top: 24px; }
  form.clock { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  form.clock label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  form.clock input[type=number], form.clock select { font: inherit; padding: 4px 6px; width: 5.5em; }
  form.clock select { width: auto; }
  form.clock button { padding: 6px 12px; margin-left: auto; }
</style>
</head>
<body>
<main>
  <h1>E-Ink Frame</h1>
  <form class="upload" action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="images" accept="image/jpeg,image/png" multiple required>
    <button type="submit">Upload</button>
  </form>
  <form class="clock" action="/clock" method="post">
    <label><input type="checkbox" name="on" value="true"{{if .Clock.On}} checked{{end}}> Ghost clock</label>
    <label>Step <input type="number" name="step" min="{{.MinStep}}" max="{{.MaxStep}}" value="{{.Clock.Step}}" required> px</label>
    <label>Style
      <select name="style">
        <option value="ink"{{if eq .Clock.Style "ink"}} selected{{end}}>Ink on the photo</option>
        <option value="chalk"{{if eq .Clock.Style "chalk"}} selected{{end}}>Chalk on a black band</option>
      </select>
    </label>
    <button type="submit">Save</button>
  </form>
  {{with .Problems}}
  <div class="problems" role="alert"><ul>{{range .}}<li>{{.}}</li>{{end}}</ul></div>
  {{end}}
  {{if .Entries}}
  <ul class="gallery">
    {{range .Entries}}
    <li{{if eq .ID $.Current}} aria-current="true"{{end}}>
      {{if eq .ID $.Current}}<span class="badge">On the Frame now</span>{{end}}
      <img src="/slides/{{.ID}}.png" alt="{{.Name}}" loading="lazy">
      <div class="meta">
        <span class="name" title="{{.Name}}">{{.Name}}</span>
        <div class="actions">
          <form action="/show/{{.ID}}" method="post">
            <button class="show" type="submit">Show now</button>
          </form>
          <form action="/delete/{{.ID}}" method="post" onsubmit="return confirm('Delete this Image?')">
            <button class="delete" type="submit">Delete</button>
          </form>
        </div>
      </div>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty">No Images yet. Upload a JPEG or PNG to start the Slideshow.</p>
  {{end}}
</main>
</body>
</html>
